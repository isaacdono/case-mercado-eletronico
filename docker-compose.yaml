services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-requisicoes_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-requisicoes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp_server:
    build: ./mcp_server
    container_name: mcp_server
    restart: always
    ports:
      - "${MCP_PORT:-8001}:${MCP_PORT:-8001}"
    env_file:
      - .env

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-requisicoes_db}

volumes:
  postgres_data:
